name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # Both toolkits are pure Go, so a CGO-free build is a real gate, not a formality.
      - name: Build (no cgo)
        run: go build ./...
        env:
          CGO_ENABLED: "0"

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...

  layer-guard:
    name: Layer guard (core and app are GUI-free)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # Single source of truth for the rule; the same script runs locally via `make dep-check`.
      # See docs/implementation/go-architecture.md §1 and decisions D-002, D-003.
      - name: Dependency policy
        run: ./scripts/check-deps.sh

      # zz_* is the scratch-file convention. Three of them were committed during
      # development (B-019 and two others) and one broke `go vet` tree-wide.
      - name: Debug leftovers
        run: ./scripts/check-debug-leftovers.sh

  # A dependency that exists in the working tree but was never committed builds
  # locally for everyone and fails for anyone who clones. That happened once:
  # internal/core/cookies was imported by three committed packages but untracked
  # (B-021), so `go build ./...` passed for every agent and a fresh checkout did
  # not compile. Building an export of HEAD catches it in one line.
  #
  # `git archive` writes only tracked files, which is exactly the question:
  # does the committed tree build on its own?
  tracked-tree-build:
    name: Tracked tree builds (no untracked deps)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build HEAD as tracked
        shell: bash
        run: |
          set -euo pipefail
          dest=$(mktemp -d)
          git archive HEAD | tar -x -C "$dest"
          cd "$dest"
          if ! go build ./... 2>"$dest/err.txt"; then
            echo "::error::HEAD does not build from tracked files alone. A package is imported but never committed — see B-021."
            cat "$dest/err.txt"
            exit 1
          fi
          echo "HEAD builds from its tracked files alone."

  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        shell: bash
        run: |
          set -euo pipefail
          unformatted=$(gofmt -l . | grep -v '^bruno/' || true)
          if [ -n "$unformatted" ]; then
            echo "::error::These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi
